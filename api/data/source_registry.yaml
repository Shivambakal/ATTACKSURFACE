    authority_level: "OFFICIAL_PRODUCT_CHANGE"
    product_scope: "Google Cloud"
    platform_scope: "Cloud Infrastructure"
    parser_strategy: "google_cloud_rss"
    collection_method: "RSS"
    feed_url: "https://cloud.google.com/feeds/gcp-release-notes.xml"
