# Official Corporate Source Registry Seed Definitions
# Contains reference source packs for top enterprise organizations.
# Each source specifies authority, collection method, polling policy, and scope.

sources:
  # =========================================================================
  # GOOGLE (google.com)
  # =========================================================================
  - company_domain: "google.com"
    name: "Google Cloud Release Notes"
    source_url: "https://cloud.google.com/release-notes"
