# Netlify Configuration for AttackSurface Timeline Frontend
# Production Domain: https://attacksurface.online

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_USE_NETLIFY_EDGE = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Reverse Proxy / API Rewrites ────────────────────────────────────
# Keeps all browser API calls same-origin (https://attacksurface.online/api/...)
# Prevents CORS errors and ensures SameSite cookies work seamlessly.
[[redirects]]
  from = "/api/*"
  to = "https://attacksurface-api.onrender.com/api/:splat"
  status = 200
  force = true
  headers = {X-Forwarded-Host = "attacksurface.online"}

# ── Production Security Headers ─────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self 'https://checkout.razorpay.com')"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://attacksurface.online https://www.attacksurface.online https://attacksurface-api.onrender.com https://api.razorpay.com https://lumberjack.razorpay.com https://accounts.google.com https://oauth2.googleapis.com; frame-src 'self' https://checkout.razorpay.com https://api.razorpay.com https://accounts.google.com; object-src 'none'; base-uri 'self';"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
